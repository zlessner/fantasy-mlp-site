  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;

  .wrap{max-width:940px;margin:0 auto;padding:0 16px}
  /* top bar with MLP⇄PPA flip */

  .flip-b:not([aria-selected=true]):hover{color:var(--ink)}

  .tgl{appearance:none;background:var(--bg2);border:1px solid var(--line);color:var(--muted);width:36px;height:36px;border-radius:9px;cursor:pointer;font-size:16px}

  .ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
  input.search{flex:1;min-width:150px;background:var(--bg2);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 12px;font-size:14px}
  input.search:focus{outline:2px solid var(--optic);outline-offset:1px}
  .seg{display:flex;gap:3px;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:3px}
  .seg button{appearance:none;border:0;background:none;color:var(--muted);font-family:var(--cond);text-transform:uppercase;letter-spacing:.05em;font-weight:700;font-size:12px;padding:6px 11px;border-radius:6px;cursor:pointer}

const money = n => '$' + n.toLocaleString();
const P = DATA.players.map(p => ({...p, value:+((p.proj||0)/(p.salary/1000)).toFixed(2)}));  // value = projected pts per $1k
const byName = Object.fromEntries(P.map(p=>[p.name,p]));
let picked = [], gender='all', sortKey='salary', sortDir=-1, query='';

document.getElementById('themeBtn').addEventListener('click',()=>{

$('#evtitle').textContent = 'PPA Salary Cap — ' + DATA.event.title;

const capUsed = () => picked.reduce((s,n)=>s+byName[n].salary,0);
const score = () => picked.reduce((s,n)=>s+byName[n].fpts,0);

function renderTray(){
  const slots=$('#slots'); slots.innerHTML='';
  for(let i=0;i<DATA.slots;i++){ const n=picked[i], p=n&&byName[n];
    const el=document.createElement('div'); el.className='slot'+(p?' filled':'');
    el.innerHTML = p ? `<span class="x" data-drop="${p.name.replace(/"/g,'')}">✕</span><span class="sn">${p.name}</span><span class="ss">${money(p.salary)} · ${p.fpts} pts</span>`
                     : `<span class="empty">Slot ${i+1}</span>`;
    slots.appendChild(el); }
  slots.querySelectorAll('[data-drop]').forEach(x=>x.onclick=()=>toggle(x.dataset.drop));
  const used=capUsed(), left=DATA.cap-used, over=used>DATA.cap;
  $('#capUsed').innerHTML = money(used) + (over?` <span class="over">over by ${money(-left)}</span>`:'');
  $('#capLeft').textContent = 'of ' + money(DATA.cap);
  const fill=$('#capFill'); fill.style.width=Math.min(100,used/DATA.cap*100)+'%'; fill.classList.toggle('over',over);
  $('#scoreN').textContent = score();
  const full=picked.length===DATA.slots;
  const projTot = picked.reduce((s,n)=>s+(byName[n].proj||0),0);
  $('#vs').innerHTML = picked.length ? `proj ≈${projTot} · ${money(left)} left · scored <b>${Math.round(score()/DATA.best.fpts*100)}%</b> of best${full&&!over?' · full':''}` : '';
}
function toggle(name){
  const i=picked.indexOf(name);
  if(i>=0) picked.splice(i,1);
  else { if(picked.length>=DATA.slots) return; if(capUsed()+byName[name].salary>DATA.cap) return; picked.push(name); }
  renderTray(); renderRows(); saveMyLineup();
}
function renderRows(){

  let list=P.filter(p=>(gender==='all'||p.gender===gender)&&(!query||p.name.toLowerCase().includes(query)));
  list.sort((a,b)=> sortKey==='name' ? a.name.localeCompare(b.name)*(-sortDir) : (a[sortKey]-b[sortKey])*sortDir );
  const rows=$('#rows'); rows.innerHTML='';
  for(const p of list){
    const isPicked=picked.includes(p.name), cantAdd=!isPicked&&(full||used+p.salary>DATA.cap);
    const tr=document.createElement('tr'); tr.className='row'+(isPicked?' picked':'')+(cantAdd?' dis':'');
    const resHTML=p.results.map(r=>`<span${/Champion/.test(r.r)?' class="champ"':''}>${r.d} ${r.r}</span>`).join(' · ');
    tr.innerHTML = `<td class="l"><span class="pn">${p.name}</span><span class="gchip ${p.gender||''}">${p.gender==='women'?'W':p.gender==='men'?'M':'?'}</span><span class="res">${resHTML||'<b>—</b>'}</span></td>
      <td class="sal">${money(p.salary)}</td><td class="proj">${p.proj??'–'}</td><td class="fp">${p.fpts}</td><td class="val">${p.value}</td>
      <td><button class="add" aria-label="${isPicked?'remove':'add'}">${isPicked?'✓':'+'}</button></td>`;
    if(!cantAdd||isPicked) tr.onclick=()=>toggle(p.name);
    rows.appendChild(tr);
  }
}
$('#q').oninput = e => { query=e.target.value.trim().toLowerCase(); renderRows(); };
$('#gender').onclick = e => { const b=e.target.closest('button'); if(!b) return; gender=b.dataset.g;
  $('#gender').querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',String(x===b))); renderRows(); };
document.querySelectorAll('th[data-sort]').forEach(th=>th.onclick=()=>{
  const k=th.dataset.sort; if(sortKey===k) sortDir*=-1; else { sortKey=k; sortDir=k==='name'?1:-1; }
  document.querySelectorAll('th[data-sort]').forEach(x=>x.removeAttribute('aria-sort'));
  th.setAttribute('aria-sort', sortDir<0?'descending':'ascending'); renderRows();
});
renderTray(); renderRows();

let _sb=null, ME=null;
function loadSb(){ return new Promise((res,rej)=>{ if(window.supabase) return res(); const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'; s.onload=res; s.onerror=()=>rej(new Error('blocked')); document.head.appendChild(s); }); }
async function initAuth(){
  try{ await loadSb(); }catch(e){ return; }
  if(!window.supabase) return;
  _sb = window.supabase.createClient(SUPA.url, SUPA.anonKey);
  try{ const {data:{session}} = await _sb.auth.getSession(); await applySession(session); }catch(e){ renderAuth(null); }
  _sb.auth.onAuthStateChange((_e,s)=>applySession(s));
}
async function applySession(session){ ME = session && session.user ? (session.user.email||'').toLowerCase() : null; renderAuth(session && session.user); if(ME) await loadMyLineup(); }
function renderAuth(user){
  const el=document.getElementById('authctl'); if(!el) return;
  if(user){ el.innerHTML=`<span class="auth-nm" title="${(user.email||'')}">${(user.email||'').split('@')[0]}</span><button class="auth-btn" id="signout">Sign out</button>`;
    document.getElementById('signout').onclick=()=>_sb.auth.signOut().then(()=>location.reload()); }
  else { el.innerHTML=`<button class="auth-btn primary" id="signin">Sign in</button>`; document.getElementById('signin').onclick=openSignin; }
}
function openSignin(){
  const el=document.getElementById('authctl');
  el.innerHTML=`<input id="ae" class="auth-email" type="email" placeholder="you@email.com" aria-label="Email"><button class="auth-btn primary" id="asend">Send link</button>`;
  const inp=document.getElementById('ae'); inp.focus();
  const send=async()=>{ const email=(inp.value||'').trim().toLowerCase(); if(!email) return; const b=document.getElementById('asend'); b.textContent='…'; b.disabled=true;
    try{ const {error}=await _sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.href } });
      el.innerHTML = error ? `<span class="auth-msg err">${error.message}</span>` : `<span class="auth-msg">✓ Check ${email} for a link.</span>`;
    }catch(e){ el.innerHTML=`<span class="auth-msg err">Sign-in failed — retry.</span>`; } };
  document.getElementById('asend').onclick=send; inp.onkeydown=e=>{ if(e.key==='Enter') send(); };
}
async function loadMyLineup(){
  try{ const {data}=await _sb.from('ppa_lineups').select('picks').eq('email',ME).eq('event_slug',DATA.event.slug).maybeSingle();
    if(data && Array.isArray(data.picks)){ picked = data.picks.filter(n=>byName[n]).slice(0,DATA.slots); renderTray(); renderRows(); } }catch(e){}
}
let _saveT=null;
function saveMyLineup(){
  if(!ME||!_sb) return; clearTimeout(_saveT);
  _saveT=setTimeout(async()=>{ try{
    await _sb.from('ppa_lineups').upsert({ email:ME, event_slug:DATA.event.slug, picks:picked, updated_at:new Date().toISOString() }, { onConflict:'email,event_slug' });
    const s=document.getElementById('saved'); if(s){ s.textContent='✓ saved'; clearTimeout(s._t); s._t=setTimeout(()=>s.textContent='',1600); }
  }catch(e){} }, 500);
}
initAuth();
